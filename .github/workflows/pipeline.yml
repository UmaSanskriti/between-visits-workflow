name: Dry-run pipeline

# Runs the full pipeline as a dry run in scratch directories on every push and on demand.
# It no longer commits: data/ and docs/data/ hold the live outreach state and are written by the local service.
#
# Kill switch (CALL-009): set the repository variable BV_KILL_SWITCH to "1" in
# Settings -> Secrets and variables -> Actions -> Variables. No deploy needed.

on:
  workflow_dispatch:
    inputs:
      now_override:
        description: "Run as if it were this instant (ISO 8601, e.g. 2026-10-21T15:00:00Z). Blank = real time."
        required: false
        default: ""
      reset:
        description: "Wipe data/ before running (start the MVP flow from scratch)"
        type: boolean
        default: false
      simulate_brain_down:
        description: "Pretend the Brain is unreachable (AC-6)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["infra/**", "seeds/**", "config.toml"]
  # Uncomment to run the scheduler on weekdays at 10:00 US/Eastern (14:00 UTC during EDT).
  # schedule:
  #   - cron: "0 14 * * 1-5"

concurrency:
  group: dry-run-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run pipeline (dry run, scratch directories; the live state in data/ is owned by the local service)
        env:
          BV_KILL_SWITCH: ${{ vars.BV_KILL_SWITCH }}
          BV_NOW: ${{ inputs.now_override }}
          BV_MOCK_BRAIN_DOWN: ${{ inputs.simulate_brain_down == true && '1' || '0' }}
          BV_DATA_DIR: /tmp/bv-ci/data
          BV_EXPORT_DIR: /tmp/bv-ci/export
        run: |
          python -m infra run --trigger "${{ github.event_name }}"
          python -c "import json; s=json.load(open('/tmp/bv-ci/export/summary.json')); print('gate escapes', s['compliance']['gate_escapes'])"
