[project]
name = "between-visits-infra"
version = "0.0.1"
description = "v0 dry-run infra pipeline for the Between Visits calling agent (sourcing, compliance gate, mock calling, transcript handoff)."
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1", "openpyxl>=3.1", "google-auth>=2.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bv = "infra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
