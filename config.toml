# Between Visits infra - v0 configuration (NFR-006: policy lives here, not in code).
# Environment overrides (used by GitHub Actions): BV_KILL_SWITCH, BV_NOW, BV_MOCK_BRAIN_DOWN.

mode = "dry_run"            # v0 supports dry_run only. Any other value is refused at startup.
kill_switch = false         # CALL-009. Flip BV_KILL_SWITCH=1 (repo variable) to halt calls without a deploy.
campaign_id = "ab-discovery-2026-q4"
default_time_zone = "America/New_York"
webhook_secret = "dry-run-shared-secret"   # mock provider only; a real secret goes in the secrets manager (NFR-003)

[calling_window]            # CMP-002, evaluated in the recipient's local time zone
days = ["Mon", "Tue", "Wed", "Thu", "Fri"]
start = "09:00"
end = "17:00"

[retry]                     # CALL-007
max_attempts = 3
min_business_days = 1
hours_local = [10, 14, 16]  # varied time of day per attempt
technical_retry_minutes = 60
brain_retry_minutes = 15    # BRN-002 backoff when the Brain is unreachable

[limits]                    # CALL-004, NFR-010
max_calls_per_run = 25
max_calls_per_day = 50

[delivery]                  # BRN-005
max_attempts = 3
backoff_seconds = 0         # 0 in dry run so test runs finish instantly

[features]
voicemail_message = false   # CMP-008: default is hang up and log VOICEMAIL

[paths]
data_dir = "data"
export_dir = "docs/data"
